<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ajitesh's AI Study Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  <style>
    body { background: #121212; color: white; font-family: -apple-system, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .dashboard { max-width: 680px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
    .greeting { text-align: left; }
    .greeting h2 { margin: 0; font-size: 24px; }
    .status { font-size: 16px; font-weight: bold; margin-top: 5px; color: #aaa; }
    .timer { font-size: 42px; font-weight: bold; color: #ffeb3b; font-variant-numeric: tabular-nums; }
    .video-box { position: relative; width: 640px; height: 360px; margin: auto; border-radius: 12px; overflow: hidden; background: #000; }
    video { transform: scaleX(-1); width: 100%; height: 100%; object-fit: cover; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .voice-bar { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; background: #262626; padding: 10px; border-radius: 10px; font-size: 14px; }
    select { background: #121212; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; font-size: 14px; max-width: 280px; }
    button { border: none; padding: 11px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-start { background: #00e676; color: #000; }
    .btn-stop { background: #ff5252; color: #fff; display: none; }
    .btn-calibrate { background: #29b6f6; color: #000; display: none; }
    .btn-secondary { background: #383838; color: #ddd; font-size: 13px; padding: 8px 14px; }
    .toggle-label { display: flex; align-items: center; gap: 6px; font-size: 14px; background: #2a2a2a; padding: 9px 14px; border-radius: 8px; cursor: pointer; }
    .log-section { margin-top: 25px; text-align: left; border-top: 1px solid #333; padding-top: 15px; }
    .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #2c2c2c; text-align: left; }
    th { color: #888; font-weight: 600; }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <div class="greeting">
        <h2>Hello, Ajitesh!</h2>
        <div class="status" id="statusText">Ready to start</div>
      </div>
      <div class="timer" id="timerDisplay">00:00:00</div>
    </div>

    <div class="video-box">
      <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="controls">
      <button class="btn-start" id="startBtn" onclick="startAssistant()">Start Studying</button>
      <button class="btn-stop" id="stopBtn" onclick="stopAssistant()">Stop & Log Session</button>
      <button class="btn-calibrate" id="calBtn" onclick="calibratePosture()">Set My Comfortable Posture</button>
      
      <label class="toggle-label">
        <input type="checkbox" id="postureToggle"> Enable Posture Alerts
      </label>
    </div>

    <!-- NEW VOICE SELECTOR BAR -->
    <div class="voice-bar">
      <span>🎙️ Assistant Voice:</span>
      <select id="voiceSelect" onchange="saveVoicePreference()"></select>
      <button class="btn-secondary" onclick="speak('Hello Ajitesh! How does this voice sound for your study session?')">🔊 Test Voice</button>
    </div>

    <div class="log-section">
      <div class="log-header">
        <h3 style="margin: 0;">Study Session Log</h3>
        <div>
          <button class="btn-secondary" onclick="exportCSV()">Download CSV</button>
          <button class="btn-secondary" onclick="clearLogs()">Clear History</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Start - End</th>
            <th>Focused Duration</th>
          </tr>
        </thead>
        <tbody id="logTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let studySeconds = 0, consecutiveSeconds = 0, awaySeconds = 0;
    let isPresent = false, isRunning = false, lastPostureWarn = 0;
    let aiInterval = null, clockInterval = null, mediaStream = null;
    let sessionStartTime = "";
    let availableVoices = [];

    let currentY = 0.5, currentW = 0.3;
    let maxAllowedY = 0.80, maxAllowedW = 0.52;

    const videoElement = document.getElementById('webcam');
    const statusText = document.getElementById('statusText');
    const timerDisplay = document.getElementById('timerDisplay');
    const postureToggle = document.getElementById('postureToggle');
    const voiceSelect = document.getElementById('voiceSelect');

    // Load and sort natural English voices (Indian, UK, US, Australian, Google)
    function loadVoices() {
      const allVoices = window.speechSynthesis.getVoices();
      if (!allVoices.length) return;

      // Filter to English voices and prioritize natural/premium ones
      availableVoices = allVoices.filter(v => v.lang.startsWith('en'));
      availableVoices.sort((a, b) => {
        const score = (v) => {
          let s = 0;
          if (v.name.includes('Premium') || v.name.includes('Enhanced') || v.name.includes('Natural')) s += 5;
          if (v.name.includes('Google')) s += 4;
          if (v.lang === 'en-IN' || v.name.includes('Rishi') || v.name.includes('Veena')) s += 3;
          if (v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Karen') || v.name.includes('Moira')) s += 2;
          return s;
        };
        return score(b) - score(a);
      });

      const savedVoice = localStorage.getItem('ajitesh_preferred_voice');
      voiceSelect.innerHTML = availableVoices.map((v, i) => 
        `<option value="${i}" ${v.name === savedVoice ? 'selected' : ''}>${v.name} (${v.lang})</option>`
      ).join('');
    }

    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 200);

    function saveVoicePreference() {
      const selected = availableVoices[voiceSelect.value];
      if (selected) localStorage.setItem('ajitesh_preferred_voice', selected.name);
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      const selected = availableVoices[voiceSelect.value];
      if (selected) msg.voice = selected;
      msg.rate = 0.96;  // Slightly smoother, less rushed pacing
      msg.pitch = 1.02; // Warmer tone
      window.speechSynthesis.speak(msg);
    }

    function formatTime(totalSecs) {
      const hrs = String(Math.floor(totalSecs / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSecs % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });
    faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

    faceDetection.onResults((results) => {
      if (!isRunning) return;
      const now = Date.now();

      if (results.detections && results.detections.length > 0) {
        if (!isPresent && awaySeconds > 15) {
          speak("Welcome back Ajitesh. Resuming timer.");
        }
        isPresent = true;
        awaySeconds = 0;

        const box = results.detections[0].boundingBox;
        currentY = box.yCenter;
        currentW = box.width;

        if (postureToggle.checked && (currentY > maxAllowedY || currentW > maxAllowedW)) {
          statusText.innerText = "Posture Check: Leaning too low/close";
          statusText.style.color = "#ff5252";
          if (now - lastPostureWarn > 45000) {
            speak("Ajitesh, check your posture.");
            lastPostureWarn = now;
          }
        } else {
          statusText.innerText = "Focused & Studying";
          statusText.style.color = "#00e676";
        }
      } else {
        isPresent = false;
        statusText.innerText = "Away - Timer Paused";
        statusText.style.color = "#ffab40";
      }
    });

    function calibratePosture() {
      maxAllowedY = currentY + 0.14;
      maxAllowedW = currentW + 0.14;
      postureToggle.checked = true;
      speak("Posture calibrated to your current position.");
      statusText.innerText = "Posture Calibrated!";
    }

    async function startAssistant() {
      studySeconds = 0; consecutiveSeconds = 0; awaySeconds = 0;
      isRunning = true;
      sessionStartTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'inline-block';
      document.getElementById('calBtn').style.display = 'inline-block';

      speak("Hello Ajitesh. Let's start studying.");
      statusText.innerText = "Starting camera...";

      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } });
      videoElement.srcObject = mediaStream;

      aiInterval = setInterval(async () => {
        if (videoElement.readyState >= 2 && isRunning) {
          await faceDetection.send({ image: videoElement });
        }
      }, 4000);

      clockInterval = setInterval(() => {
        if (!isRunning) return;
        if (isPresent) {
          studySeconds++;
          consecutiveSeconds++;
          if (consecutiveSeconds === 3000) {
            speak("Ajitesh, you have studied for 50 minutes. Take a 5 minute rest.");
          }
        } else {
          awaySeconds++;
          if (awaySeconds === 300) {
            speak("Rest is over Ajitesh. Come back to your desk.");
            consecutiveSeconds = 0;
          }
        }
        timerDisplay.innerText = formatTime(studySeconds);
      }, 1000);
    }

    function stopAssistant() {
      isRunning = false;
      clearInterval(aiInterval);
      clearInterval(clockInterval);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      videoElement.srcObject = null;

      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('calBtn').style.display = 'none';

      const mins = Math.floor(studySeconds / 60);
      statusText.innerText = `Session Stopped (${ formatTime(studySeconds) } logged)`;
      statusText.style.color = "#aaa";
      speak(`Good job Ajitesh. Session saved. You studied for ${mins} minutes.`);

      saveSessionLog();
    }

    function saveSessionLog() {
      if (studySeconds < 5) return;
      const logs = JSON.parse(localStorage.getItem('ajitesh_study_logs') || '[]');
      const endTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      logs.unshift({
        date: new Date().toLocaleDateString(),
        timeRange: `${sessionStartTime} - ${endTime}`,
        duration: formatTime(studySeconds)
      });
      localStorage.setItem('ajitesh_study_logs', JSON.stringify(logs));
      renderLogs();
    }

    function renderLogs() {
      const logs = JSON.parse(localStorage.getItem('ajitesh_study_logs') || '[]');
      const tbody = document.getElementById('logTableBody');
      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#666;">No study sessions logged yet.</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map(l => `
        <tr>
          <td>${l.date}</td>
          <td>${l.timeRange}</td>
          <td style="color:#00e676; font-weight:bold;">${l.duration}</td>
        </tr>
      `).join('');
    }

    function exportCSV() {
      const logs = JSON.parse(localStorage.getItem('ajitesh_study_logs') || '[]');
      if (!logs.length) return alert("No sessions to export yet!");
      let csv = "Date,Start - End,Duration\n" + logs.map(l => `${l.date},${l.timeRange},${l.duration}`).join("\n");
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "Ajitesh_Study_Log.csv";
      a.click();
    }

    function clearLogs() {
      if (confirm("Clear all saved study logs?")) {
        localStorage.removeItem('ajitesh_study_logs');
        renderLogs();
      }
    }

    renderLogs();
  </script>
</body>
</html>
